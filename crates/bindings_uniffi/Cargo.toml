[package]
name = "binary_options_tools_uni"
version = "0.2.18"
edition = "2021"
authors = ["ChipaDevTeam"]
repository = "https://gitlab.chipatrade.com/chipadevorg/BinaryOptionsTools-v2"
homepage = "https://chipatrade.gitlab.io/chipadevorg/BinaryOptionsTools-v2"
documentation = "https://chipatrade.gitlab.io/chipadevorg/BinaryOptionsTools-v2/"
description = "UniFFI bindings for binary-options-tools. Enables multi-language support (Kotlin, Swift, Python) for cross-platform binary options trading automation."
keywords = ["binary-options", "uniffi", "cross-platform", "trading"]
categories = ["api-bindings"]
license-file = "../../LICENSE"

[features]
default = ["python", "swift", "go"]
kotlin = []
swift = []
csharp = []
go = []
ruby = []
python = []
javascript = []

[lib]
name = "binary_options_tools_uni"
crate-type = ["cdylib", "staticlib"]

[dependencies]
uniffi = { workspace = true }
binary_options_tools = { path = "../binary_options_tools", version = "0.2.18", default-features = false, features = ["pocketoption"] }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
rust_decimal = { workspace = true }
uuid = { workspace = true }
regex = { workspace = true }
bo2_macros = { version = "0.2.18", path = "bo2_macros" }
url = { workspace = true }

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }
