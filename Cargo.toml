[workspace]
resolver = "2"

members = [
    "crates/core", "crates/core/macros/",
    "crates/macros",
    "crates/binary_options_tools",
    "crates/bindings_napi",
    "crates/bindings_pyo3",
    "crates/bindings_uniffi",
    "crates/bindings_uniffi/bo2_macros",
    # Separate crate so uniffi/cli (clap and friends) is not built for the cdylib.
    # Note: `cargo build --workspace` unifies features and still enables cli; only
    # package-scoped builds (-p binary_options_tools_uni, the wheel and addon jobs)
    # skip it.
    "crates/bindings_uniffi/uniffi-bindgen",
]

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
darling = { version = "0.23.0", features = ["serde"] }
futures-util = "0.3.34"
kanal = "0.1.1"
rand = "0.9.5"
# regex-lite: same API for every pattern this repository uses, without the
# aho-corasick/regex-automata/regex-syntax stack (~26s of the wheel build).
regex = { package = "regex-lite", version = "0.1.8" }
rust_decimal = { version = "1.43.0", features = ["serde", "macros", "serde-with-float"] }
rust_decimal_macros = "1.40.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = "1.54.1"
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["rustls-tls-webpki-roots", "connect", "handshake"] }
tracing = "0.1.44"
# no env-filter: it pulls matchers -> regex-automata into every crate. The one
# caller that reads RUST_LOG uses filter::Targets instead.
tracing-subscriber = "0.3.23"
uniffi = "0.32.2"
base64 = "0.23"
http = "1.5"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
 zyn = "0.5.4"

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
panic = 'abort'
strip = true

[profile.dev]
opt-level = 0
debug = 1
lto = false
codegen-units = 256

